<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Magazijn Zoeker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Centraal magazijn</p>
        <h1>Magazijn Zoeker</h1>
      </div>
      <button id="installBtn" class="ghost-btn" hidden>Installeren</button>
    </header>

    <section class="search-card">
      <label for="searchInput">Zoek artikel, omschrijving of locatie</label>
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Bijv. keramiek, 1480551 of FOA065" autocomplete="off" />
        <button id="clearBtn" title="Zoekveld leegmaken">×</button>
      </div>
      <div class="quick-filters">
        <button data-filter="">Alles</button>
        <button data-filter="PM1">PM1</button>
        <button data-filter="PM2">PM2</button>
        <button data-filter="FOA">FOA</button>
        <button data-filter="CHEB">CHEB</button>
      </div>
    </section>

    <section class="status-row">
      <span id="statusText">CSV wordt geladen...</span>
      <span id="countText"></span>
    </section>

    <section id="results" class="results"></section>

    <template id="resultTemplate">
      <article class="result-card">
        <div class="result-main">
          <div>
            <p class="article-number"></p>
            <h2 class="description"></h2>
          </div>
          <span class="location-pill"></span>
        </div>
        <dl class="details-grid">
          <div><dt>Magazijn</dt><dd class="magazijn"></dd></div>
          <div><dt>Vestiging</dt><dd class="vestiging"></dd></div>
          <div><dt>Soort</dt><dd class="soort"></dd></div>
          <div><dt>Groep</dt><dd class="groep"></dd></div>
        </dl>
      </article>
    </template>
  </main>

  <script src="app.js"></script>
</body>
</html>
