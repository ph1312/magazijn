<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Magazijn Zoeker</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <meta name="theme-color" content="#007bff">
</head>

<body>

    <div class="hero">
        <div class="hero-content">

            <div class="sub-title">
                CENTRAAL MAGAZIJN
            </div>

            <h1>
                Magazijn Zoeker
            </h1>

            <div class="search-card">
                <label for="search">
                    Zoek artikel, omschrijving of locatie
                </label>

                <div class="search-row">
                    <input
                        id="search"
                        type="text"
                        placeholder="Bijvoorbeeld FOA065, keramiek of artikelnummer..."
                        autocomplete="off"
                    >

                    <button
                        id="clear-btn"
                        type="button"
                        aria-label="Zoekveld leegmaken"
                    >
                        ✖
                    </button>
                </div>
            </div>

            <div class="filter-row">
                <button class="filter-btn active" data-filter="alles">Alles</button>
                <button class="filter-btn" data-filter="PM1">PM1</button>
                <button class="filter-btn" data-filter="PM2">PM2</button>
                <button class="filter-btn" data-filter="FOA">FOA</button>
                <button class="filter-btn" data-filter="CHEB">CHEB</button>
            </div>

        </div>
    </div>

    <main>
        <div class="result-header">
            <div id="result-count">
                CSV laden...
            </div>
        </div>

        <div id="results">
            <div class="empty">
                Typ hierboven om te zoeken.
            </div>
        </div>
    </main>

    <script src="app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js");
        }
    </script>

</body>
</html>
